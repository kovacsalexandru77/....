<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>FilmKing – HTML nézet</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0 10px;
    }
    h1 {
      color: cyan;
      text-align: center;
      font-size: 2rem;
      text-transform: uppercase;
      margin-top: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .card {
      background: #222;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
    }
    .card.selected {
      border: 6px solid yellow;
    }
    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-top: 4px solid cyan;
      border-bottom: 2px solid cyan;
      border-radius: 12px 12px 0 0;
    }
    .card-title { 
      padding: 10px; 
      text-align: center; 
      font-size: 14px; 
      color: cyan; 
      border: 2px solid cyan; 
      border-radius: 8px;
    }
    .card-description {
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: orange;
      max-height: 100px;
      overflow: hidden;
      position: relative;
      border: 2px solid cyan; 
      border-radius: 5px;
    }
    .card-description .more-text {
      display: none;
    }
    .card-description.show-more .more-text {
      display: inline;
    }
    .card-description.show-more .dots {
      display: none;
    }
    .card-description .more-btn {
      color: cyan;
      cursor: pointer;
      font-weight: bold;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal.show {
      display: flex;
    }
    iframe {
      width: 90%;
      height: 90%;
      border: 4px solid black;
    }
    .pagination {
      text-align: center;
      margin-bottom: 30px;
    }
    .pagination button { 
      background: orange; 
      color: black; border: none; 
      padding: 8px 12px; 
      margin: 0 5px; 
      border-radius: 4px; 
      border: 2px solid cyan;
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.3s ease;
    }
    .pagination button.active {
      background: cyan;
      color: #000;
    }
    .pagination button:hover {
      box-shadow: 0 0 8px cyan;
    }
    .pagination span {
      cursor: default;
      color: gray;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: cyan;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
    }
    .hero-image {
      display: block;
      width: 100%;
      height: 370px;
      object-fit: cover;
      border-radius: 84px;
      margin-top: 20px;
      box-shadow: 0 0 60px rgba(0, 255, 255, 1.5);
    }
    .year-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 255, 255, 0.7);
      padding: 5px 10px;
      font-size: 16px;
      color: black;
      font-weight: bold;
      border-radius: 6px;
      z-index: 100;
    }
    #player-background {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 9998;
    }
    #player-content {
      background: #222;
      padding: 10px;
      border-radius: 4px;
      max-width: 100%;
      max-height: 1000%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <img src="https://archive.org/download/nerflixsandu/nerflixsandu.png" alt="FilmKing Hero Image" class="hero-image" />
  <div class="grid" id="movies"></div>
  <div class="pagination" id="pagination"></div>
  <button class="back-btn" id="backBtn" style="display: none;">Vissza</button>
  <div id="player-background" onclick="closePlayer()">
    <div id="player-content" onclick="event.stopPropagation()">
      <!-- Itt van a lejátszó -->
    </div>
  </div>
  <script>

    const container = document.getElementById('movies');
    const paginationContainer = document.getElementById('pagination');
    const maxPages = 130; // Például a sorozatok maximális oldalszáma
    const supportedHosts = ["ok.ru", "vidoza", "upstream", "uqload", "dood", "mixdrop", "od.lk", "videa.hu", "vk.com", "streamtape.com", "streamlare.com", "sbembed.com", "voe.sx", "filemoon.sx", "vidhide.com", "filelions.com", "zippyshare.com", "youtube.com", "drive.google.com"];

    function loadPage(page = 1) {
      container.innerHTML = "<h3 style='text-align:center'>Betöltés...</h3>";
      const url = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://filmking.eu/filmek-evszam-szerint/' + (page > 1 ? page + '/' : ''))}`;

      fetch(url)
        .then(res => res.text())
        .then(html => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const articles = doc.querySelectorAll('article');
          container.innerHTML = '';
          const seen = new Set();

          articles.forEach(article => {
            const img = article.querySelector('img')?.src;
            const title = article.querySelector('h3')?.innerText;
            const link = article.querySelector('a.elementor-post__thumbnail__link')?.href;
            const yearElement = article.querySelector('.elementor-post__badge');

            const year = yearElement ? yearElement.innerText : 'N/A';
            
            if (img && title && link && !seen.has(img)) {
              seen.add(img);
              const card = document.createElement('div');
              card.className = 'card';

              fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(link)}`)
                .then(res => res.text())
                .then(page => {
                  const detailDoc = new DOMParser().parseFromString(page, 'text/html');
                  const description = detailDoc.querySelector('.film-bilgileri .movies-data')?.innerText || "Nincs elérhető leírás.";
                  const category = detailDoc.querySelector('.elementor-icon-list-text')?.innerText || 'N/A';

                  card.innerHTML = `
                    <img src="${img}">
                    <div class="year-tag">${year}</div>
                    <div class="card-title">${title}</div>
                    <div class="card-description">
                      <div class="film-bilgileri">
                        <div class="movies-data">
                          ${description}
                        </div>
                      </div>
                      <div class="dots">...</div>
                      <div class="more-text">${description}</div>
                      <span class="more-btn">Tovább olvasom</span>
                    </div>
                    <div class="card-title"><strong>${category}</strong></div>
                  `;

                  const moreBtn = card.querySelector('.more-btn');
                  const cardDesc = card.querySelector('.card-description');
                  moreBtn.addEventListener('click', () => {
                    cardDesc.classList.toggle('show-more');
                    moreBtn.textContent = cardDesc.classList.contains('show-more') ? 'Bezárás' : 'Tovább olvasom';
                  });

                  card.onclick = () => {
                    const iframes = detailDoc.querySelectorAll('iframe');
                    let foundSrc = null;

                    iframes.forEach(iframe => {
                      let src = iframe.getAttribute('src');
                      if (src) {
                        if (src.startsWith('//')) src = 'https:' + src;
                        if (!src.startsWith('http')) src = 'https://' + src;

                        if (supportedHosts.some(host => src.includes(host)) && !foundSrc) {
                          foundSrc = src;
                        }
                      }
                    });

                    if (foundSrc) {
                      openModal(foundSrc);
                    } else {
                      alert("Nem található megfelelő lejátszó link.");
                    }
                  };

                  container.appendChild(card);
                });
            }
          });

          updatePagination(page);
        });
    }

    function updatePagination(currentPage) {
      paginationContainer.innerHTML = '';
      const createBtn = (num, label = null) => {
        const btn = document.createElement('button');
        btn.textContent = label || num;
        if (num === currentPage) btn.classList.add('active');
        btn.onclick = () => loadPage(num);
        paginationContainer.appendChild(btn);
      };

      if (currentPage > 1) {
        createBtn(currentPage - 1, 'Előző');
      }

      for (let i = 1; i <= maxPages; i++) {
        if (i === currentPage || (i >= currentPage - 2 && i <= currentPage + 2)) {
          createBtn(i);
        }
      }

      if (currentPage < maxPages) {
        createBtn(currentPage + 1, 'Következő');
      }

      const totalPagesText = document.createElement('span');
      totalPagesText.textContent = `Oldal: ${currentPage} / ${maxPages}`;
      paginationContainer.appendChild(totalPagesText);
    }

    function openModal(src) {
      const modal = document.getElementById('player-background');
      const playerContent = document.getElementById('player-content');
      
      // Itt beállítjuk a lejátszó iframe méretét
      playerContent.innerHTML = `
          <iframe src="${src}" frameborder="0" allowfullscreen style="width: 80vw; height: 80vh;"></iframe>
      `;
      
      modal.style.display = 'flex';
    }

    function closePlayer() {
      const modal = document.getElementById('player-background');
      modal.style.display = 'none';
      const playerContent = document.getElementById('player-content');
      playerContent.innerHTML = '';
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    loadPage();
  </script>
</body>
</html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filminvázió Böngésző</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: Arial, sans-serif;
      color: white;
    }
    header {
      background-color: #1c1c1c;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      color: cyan;
    }
    #movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .movie {
      background-color: #222;
      border: 6px solid limegreen;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .movie:hover {
      transform: scale(1.05);
      box-shadow: 0 0 32px limegreen;
    }
    .movie img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px 8px 0 0;
    }
    .movie-title {
      padding: 10px;
      text-align: center;
      font-size: 18px;
      color: cyan;
    }
    .movie-title small {
      display: block;
      color: orange;
      font-size: 12px;
      margin-top: 4px;
    }
    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .loader {
      border: 8px solid #333;
      border-top: 8px solid cyan;
      border-radius: 80%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #playerModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 99999;
    }
    #playerModal.show {
      display: flex;
    }
    #playerIframe {
      width: 98%;
      height: 98%;
      border: 8px solid black;
    }
    #movieDesc {
      margin-top: 15px;
      padding: 10px;
      max-width: 900px;
      text-align: center;
      color: #ccc;
    }
    #closeBtn {
      background: darkred;
      color: white;
      border: 4px solid cyan;
      padding: 2px 2px;
      cursor: pointer;
      border-radius: 5px;
      position: fixed;
      bottom: 10px;
      left: 98%;
      transform: translateX(-1%);
    }
    #loadMoreBtn {
      text-align: center;
      padding: 20px;
    }
    #loadMoreBtn button {
      padding: 12px 24px;
      font-size: 16px;
      background: cyan;
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px cyan;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #loadMoreBtn button:hover {
      background: #00ffff;
      box-shadow: 0 0 20px cyan;
    }
    header img {
      width: 200px;
      height: 40px;
      display: block;
      margin: 0 auto;
    }
    #currentMovieTitle {
      position: absolute;
      bottom: 2px;
      right: 20px;
      font-size: 10px;
      color: cyan;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <header>
  <div id="movies"></div>
  <div id="loadMoreBtn">
    <button onclick="loadMoreMovies()">Több film betöltése</button>
  </div>
  <div id="preloader">
    <div class="loader"></div>
  </div>
  <div id="playerModal">
    <div id="closeBtn" onclick="closeModal()">×</div>
    <iframe id="playerIframe" allowfullscreen></iframe>
    <div id="movieDesc"></div>
    <div id="currentMovieTitle" style="display:none;"></div>
  </div>
  <script>
    const proxy = "https://api.allorigins.win/get?url=";
    const baseUrl = "https://filminvazio.pro/videa-film/page/";
    let currentPage = 1;

    function fetchMovies(page = 1) {
      document.getElementById("preloader").style.display = "flex";
      fetch(proxy + encodeURIComponent(baseUrl + page + "/"))
        .then(res => {
          if (!res.ok) throw new Error("Hálózati hiba");
          return res.json();
        })
        .then(data => {
          const doc = new DOMParser().parseFromString(data.contents, "text/html");
          const items = doc.querySelectorAll(".item.movies");
          const container = document.getElementById("movies");

          if (items.length === 0 && page === 1) {
            container.innerHTML = "<p style='color:red;'>Nem találtunk filmeket.</p>";
          }

          items.forEach(item => {
            const link = item.querySelector("a")?.href;
            const title = item.querySelector("h3")?.textContent.trim();
            const year = item.querySelector("h3 + span")?.textContent.trim();
            const image = item.querySelector("img")?.src;
            const genreElements = item.querySelectorAll(".genres .mta a");
            const genres = Array.from(genreElements).map(a => a.textContent).join(", ");

            if (link && title && image) {
              const div = document.createElement("div");
              div.className = "movie";
              div.innerHTML = `
                <img src="${image}" alt="${title}">
                <div class="movie-title">${title} <small>${year || ""}</small><br><small>${genres || ""}</small></div>
              `;
              div.onclick = () => loadPlayer(link, title, image);
              container.appendChild(div);
            }
          });

          document.getElementById("preloader").style.display = "none";
        })
        .catch(err => {
          console.error("Hiba a filmek betöltésekor:", err);
          document.getElementById("preloader").style.display = "none";
        });
    }

    function loadMoreMovies() {
      currentPage += 1;
      fetchMovies(currentPage);
    }

    function loadPlayer(link, title, image) {
      document.getElementById("preloader").style.display = "flex";
      fetch(proxy + encodeURIComponent(link))
        .then(res => {
          if (!res.ok) throw new Error("Hiba a lejátszó lekérésekor");
          return res.json();
        })
        .then(data => {
          const doc = new DOMParser().parseFromString(data.contents, "text/html");
          const iframe = doc.querySelector('iframe[src*="ok.ru"], iframe[src*="videa"], iframe[src*="mozimix"]');
          const desc = doc.querySelector('meta[name="description"]')?.content || "Nincs leírás.";
          if (iframe) {
            let src = iframe.getAttribute("src");
            if (src.startsWith("//")) src = "https:" + src;
            document.getElementById("playerIframe").src = src;
            document.getElementById("movieDesc").innerText = title + " – " + desc;
            document.getElementById("currentMovieTitle").innerText = title;
            document.getElementById("playerModal").classList.add("show");
          } else {
            alert("Nem találtunk lejátszó iframe-et.");
          }
          document.getElementById("preloader").style.display = "none";
        })
        .catch(err => {
          alert("Hiba történt a lejátszó betöltésekor.");
          console.error(err);
          document.getElementById("preloader").style.display = "none";
        });
    }

    function closeModal() {
      document.getElementById("playerModal").classList.remove("show");
      document.getElementById("playerIframe").src = "";
    }

    // Első oldal betöltése induláskor
    fetchMovies(currentPage);
  </script>
</body>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Cián Színű Óra</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    #clock {
      position: fixed;
      top: 10px;
      right: 20px;
      color: cyan;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      z-index: 999999; /* mindig minden fölött legyen */
      pointer-events: none; /* ne zavarja a kattintást semmin */
    }
  </style>
</head>
<body>

<div id="clock">Betöltés...</div>

<script>
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>
